# Codemagic: build the iOS app from app/ and upload it to TestFlight.
# One-time setup in Codemagic: connect the repository, add an App Store Connect API key under
# Teams → Integrations (name it "app_store_connect"), and let Codemagic manage signing
# (Automatic code signing with that key). Then start the "ios-testflight" workflow.
workflows:
  ios-testflight:
    name: iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: app_store_connect
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.stickandspeak.kids
      node: 20
      xcode: latest
      vars:
        XCODE_WORKSPACE: "app/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
    scripts:
      - name: Install dependencies
        script: cd app && npm ci
      - name: Web assets, artwork, voice clips into the iOS project
        script: |
          cd app
          rm -rf www && cp -r ../web www && rm -rf www/.vercel www/.gitignore www/README.md
          npx cap sync ios
      - name: Signing profiles
        script: xcode-project use-profiles
      - name: Build number
        script: |
          cd app/ios/App
          agvtool new-version -all $(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0) + 1))
      - name: Archive
        script: xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Friends
